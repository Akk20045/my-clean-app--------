name: Build App
on: [workflow_dispatch, push]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install --prefer-offline --no-audit
      - name: Prepare Web App
        run: node prepare-www.cjs
      - run: npx cap add android
      - name: Inject Custom App Icons
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/drawable
          if [ -f assets/icon-48.png ]; then
            cp assets/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
            cp assets/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png || true
            cp assets/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
            cp assets/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png || true
            cp assets/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
            cp assets/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png || true
            cp assets/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
            cp assets/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png || true
            cp assets/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
            cp assets/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
            cp assets/icon-512.png android/app/src/main/res/drawable/splash.png || true
          elif [ -f assets/icon.png ]; then
            cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
            cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          fi
          if [ -f assets/splash.png ]; then
            cp assets/splash.png android/app/src/main/res/drawable/splash.png || true
          fi
      - name: Configure Android Permissions, Manifest & App Name
        shell: bash
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml || true
          sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' android/app/src/main/AndroidManifest.xml || true
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n</manifest>|' android/app/src/main/AndroidManifest.xml || true
          
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">تحصيل</string>|' android/app/src/main/res/values/strings.xml || true
            sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">تحصيل</string>|' android/app/src/main/res/values/strings.xml || true
          fi
      - name: Enhance MainActivity with Full WebSettings & KeepScreenOn
        shell: bash
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT" ]; then
            PKG_LINE=$(grep "^package " "$MAIN_ACT" | head -n 1)
            cat << 'EOF' > "$MAIN_ACT"
          $PKG_LINE

          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
              }

              @Override
              public void onStart() {
                  super.onStart();
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          WebSettings settings = webView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setAllowFileAccess(true);
                          settings.setAllowContentAccess(true);
                          settings.setAllowFileAccessFromFileURLs(true);
                          settings.setAllowUniversalAccessFromFileURLs(true);
                          settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF
            sed -i "s|\$PKG_LINE|$PKG_LINE|" "$MAIN_ACT"
          fi
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
      - name: Fast Parallel Build APK & AAB
        run: |
          cd android
          ./gradlew assembleDebug bundleDebug --no-daemon --parallel
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./myapp.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab ./myapp.aab
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: |
            *.apk
            *.aab
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install --prefer-offline --no-audit
      - name: Prepare Web App
        run: node prepare-www.cjs
      - name: Create Electron Main
        shell: bash
        run: |
          cat << 'EOF' > main.js
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow () {
            const win = new BrowserWindow({ 
              width: 1280, 
              height: 800,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });
            win.loadFile(path.join(__dirname, 'www', 'index.html'));
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF
      - name: Build Windows
        shell: bash
        run: |
          npx electron-builder --win --x64 --publish never
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/*.exe
  ios-web-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install --prefer-offline --no-audit
      - name: Prepare Web App
        run: node prepare-www.cjs
      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-web-pwa
          path: www
      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: 'www'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true